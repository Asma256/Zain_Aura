<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenAura – Mood Boxes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="header sticky-header">
  <div class="container">
    <div class="header-content">
      <a href="accueil.html" class="logo">
        <span class="logo-icon">ZA</span>
        <span class="logo-text">ZenAura</span>
      </a>

      <nav class="nav">
        <a href="boxes.html" class="nav-link">Mood Boxes</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="inscription.html" class="nav-link">Subscribe</a>
      </nav>

      <div class="header-actions">
        <a href="wishlist.html" class="header-icon wish-icon">
          <i class="fa-regular fa-heart"></i>
        </a>

        <a href="cart.html" class="header-icon cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>

        <a href="inscription.html" class="btn-signup">Sign Up</a>
        <a href="login.html" class="btn-login">Log In</a>
      </div>
    </div>
  </div>
</header>

<section class="boxes-hero container">
  <h1>Mood Boxes</h1>
  <p>Choisissez une box pensée pour votre humeur — apaisante, joyeuse, concentrée ou réparatrice.</p>
</section>

<main class="boxes-wrapper container">

  <!-- Calm Box -->
  <section class="box-section" id="calm">
    <div class="box-header">
      <div class="box-title">
        <h2>Calm Box</h2>
        <p class="box-desc">Rituels doux pour se détendre et retrouver la présence.</p>
      </div>
    </div>

    <div class="cards-grid">
      <article class="card">
        <div class="card-img"><img src="images/image1.jpg"></div>
        <div class="card-body">
          <h3>Bougie Lavande</h3>
          <p>Mélange lavande-chamomile.</p>
          <button class="btn-order" data-name="Bougie Lavande" data-price="59">Commander</button>
        </div>
      </article>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container">
    <p id="copyrightYear"></p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
